# 인스타 접근 키(60일 만료)를 매주 월요일 갱신해 Secrets에 다시 저장한다. GH_PAT가 있어야 저장할 수 있다.
name: 접근 키 갱신
on:
  schedule:
    - cron: "0 1 * * 1" # 매주 월요일 10시(한국 시간)
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          IG_SYSTEM_TOKEN: ${{ secrets.IG_SYSTEM_TOKEN }}
          IG_USER_ID_HUGIDAM: ${{ vars.IG_USER_ID_HUGIDAM }}
          IG_USER_ID_SAJU: ${{ vars.IG_USER_ID_SAJU }}
          IG_TOKEN_HUGIDAM: ${{ secrets.IG_TOKEN_HUGIDAM }}
          IG_TOKEN_SAJU: ${{ secrets.IG_TOKEN_SAJU }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: node scripts/refresh-tokens.mjs
