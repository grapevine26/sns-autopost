# 대기열을 보고 올릴 차례가 된 릴스를 계정마다 한 편씩 올린다.
# GitHub의 예약 실행은 몇 시간씩 안 돌 때가 있다(2026-11-04: 6시간 넘게 0회). 2시간 넘게 늦은 편은
# 새벽에 올리지 않고 하루씩 미룬다(scripts/post.mjs). 정시 실행은 바깥에서 깨워 주는 장치가 맡는다.
name: 릴스 자동 게시
on:
  schedule:
    # 매시 한 번이면 GitHub가 바쁠 때 몇 시간씩 건너뛴다(2026-11-03: 하루 4번만 실행) — 10분마다 두드려 늦어도 예정 시각 가까이 올라가게
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "올리지 않고 무엇을 올릴지만 보기"
        type: boolean
        default: true
      prepare_only:
        description: "시험: 다음 편을 인스타에 보내 처리까지만 하고 게시하지 않기"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # 실행을 시작한 시점의 커밋이 아니라 지금의 main을 받는다. 실행이 겹쳐 줄을 섰다가 돌 때,
      # 앞 실행이 남긴 게시 기록(posted.json)을 봐야 같은 편을 두 번 올리지 않는다.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 게시
        env:
          IG_SYSTEM_TOKEN: ${{ secrets.IG_SYSTEM_TOKEN }}
          IG_USER_ID_HUGIDAM: ${{ vars.IG_USER_ID_HUGIDAM }}
          IG_USER_ID_SAJU: ${{ vars.IG_USER_ID_SAJU }}
          IG_TOKEN_HUGIDAM: ${{ secrets.IG_TOKEN_HUGIDAM }}
          IG_TOKEN_SAJU: ${{ secrets.IG_TOKEN_SAJU }}
          PAGES_BASE: ${{ vars.PAGES_BASE || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          PREPARE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_only && '1' || '0' }}
        run: node scripts/post.mjs
      - name: 올린 기록 저장
        if: always()
        run: |
          if ! git diff --quiet posted.json queue.json; then
            git config user.name "sns-autopost"
            git config user.email "actions@users.noreply.github.com"
            git add posted.json queue.json
            git commit -m "게시 기록 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
